name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          extra-packages: -e ".[dev]"
      - uses: dataciviclab/.github/actions/python-ci@main
        with:
          lint_paths: "dashboard"
          mypy_paths: ""
          test_dir: ""
          pytest_args: ""
