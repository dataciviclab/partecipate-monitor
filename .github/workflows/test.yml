name: Test rapido
on:
  pull_request:
    paths:
      - 'src/**'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dataciviclab/.github/actions/python-setup@main
        with:
          extra-packages: -e .
      - name: Smoke test profiler
        run: python -m src.profiler 00000000000

      - name: Verifica appalti_vinti in data.json
        run: |
          python -c "
          import json
          d = json.load(open('reports/data.json'))
          p = d.get('profili', [])
          assert p, 'nessun profilo'
          av = [x for x in p if x.get('appalti_vinti')]
          assert av, 'nessun appalti_vinti'
          print(f'OK: {len(p)} profili, {len(av)} con vinti')
          "
