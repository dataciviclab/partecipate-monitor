[project]
name = "partecipate-monitor"
version = "0.2.0"
description = "Intelligence sulle societa' partecipate pubbliche italiane — pipeline dati + dashboard Streamlit"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
pipeline = [
    "dataciviclab-toolkit @ git+https://github.com/dataciviclab/toolkit.git",
    "lab-connectors[duckdb] @ git+https://github.com/dataciviclab/lab-connectors.git",
]
dashboard = [
    "streamlit>=1.61",
    "plotly>=5.18",
    "altair>=6.2",
    "lab-connectors[duckdb] @ git+https://github.com/dataciviclab/lab-connectors.git",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.10",
]

[tool.setuptools]
py-modules = []
